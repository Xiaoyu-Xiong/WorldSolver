schema_version: 4
task_id: 052_soluble_bunny_water
criteria:
  execution:
  - id: executable_and_evaluable
    criterion: The submitted solver runs to the frozen end time, produces a complete finite trajectory
      with every required evaluation field, and produces a readable platform render without exceeding
      the resource limits.
  visual:
  - id: visible_event_onset
    dimension: event_sequence
    criterion: Water from the pipe visibly reaches, surrounds, and deforms the soluble bunny.
  - id: visible_interaction_response
    dimension: interaction_response
    criterion: The bunny progressively shrinks or loses material from water-contacting regions rather
      than disappearing instantaneously.
  - id: visible_signature_outcome
    dimension: signature_phenomenon
    criterion: Red dissolved material visibly enters the water and is carried away from the bunny by the
      flow.
  - id: case_visual_coherence
    dimension: temporal_coherence
    criterion: The remaining bunny and colored water evolve continuously without remote color creation,
      abrupt whole-body deletion, teleportation, or disconnected solid fragments appearing away from contact.
  physics:
  - id: material_mass_balance
    profile: multiphysics_coupling
    dimension: conservation_and_source_balance
    criterion: For solid, dissolved, and water components including reported transfer, the mass change
      equals the cumulative prescribed inflow, outflow, or phase-transfer source; internal motion and
      contact do not create or delete mass.
    applicability:
      requires:
      - prescribed sources and sinks are exported
      - Per-sample mass contributions are exported for every evaluated material.
      excludes:
      - Unreported particle deletion or remeshing loss.
    numeric_binding:
      calculator: balance.source_aware.v1
      inputs:
        quantity: attributes.mass_quantity
        cumulative_source: fields.cumulative_mass_source
      parameters: {}
      reduction:
        type: maximum
  - id: transported_scalar_consistency
    profile: multiphysics_coupling
    dimension: transport_equation_consistency
    criterion: The exported dissolved concentration in soluble bunny water evolves consistently with its
      collocated velocity and prescribed local source.
    applicability:
      requires:
      - The dissolved concentration, carrier velocity, source field, and active mask are exported on one
        grid.
      excludes:
      - Unmodeled subgrid injection or removal of the scalar.
    numeric_binding:
      calculator: field.scalar_transport.v1
      inputs:
        scalar_field: fields.transported_scalar
        velocity_field: fields.velocity_field
        source_field: fields.scalar_source
        active_mask: fields.active_mask
        grid_spacing: scalars.grid_spacing
      parameters:
        spatial_dimensions: 3
      reduction:
        type: maximum
  - id: internal_coupling_force_balance
    profile: multiphysics_coupling
    dimension: multiphysics_exchange_balance
    criterion: The paired internal interaction forces exchanged between materials in soluble bunny water
      are equal and opposite in the aggregate.
    applicability:
      requires:
      - Both sides of every internal coupling or contact force pair are exported.
      excludes:
      - External actuator, gravity, or boundary reaction forces.
    numeric_binding:
      calculator: coupling.force_balance.v1
      inputs:
        interaction_force: fields.interaction_force
      parameters: {}
      reduction:
        type: maximum
  - id: orientation_preserving_deformation
    profile: multiphysics_coupling
    dimension: deformation_validity
    criterion: Material elements in the remaining deformable bunny retain a positive deformation Jacobian
      except where the case explicitly performs a represented topology change.
    applicability:
      requires:
      - A deformation gradient is exported for every active material element.
      excludes:
      - Elements at an explicitly modeled cut, tear, merge, or deletion event after they cease to exist.
    numeric_binding:
      calculator: deformation.jacobian.v1
      inputs:
        deformation_gradient: attributes.deformation_gradient
      parameters: {}
      reduction:
        type: maximum
