schema_version: 4
task_id: 018_self_supporting_arch
criteria:
  execution:
  - id: executable_and_evaluable
    criterion: The submitted solver runs to the frozen end time, produces a complete finite trajectory
      with every required evaluation field, and produces a readable platform render without exceeding
      the resource limits.
  visual:
  - id: visible_event_onset
    dimension: event_sequence
    criterion: The rigid blocks retain the intended parabolic arch arrangement after gravity is applied.
  - id: visible_interaction_response
    dimension: interaction_response
    criterion: Neighboring blocks remain in supporting contact without a progressive opening of joints
      or sliding cascade.
  - id: visible_signature_outcome
    dimension: signature_phenomenon
    criterion: The arch remains visibly self-supporting, with no block-by-block collapse or sudden explosive
      separation.
  - id: case_visual_coherence
    dimension: temporal_coherence
    criterion: The arch geometry evolves continuously without visible block interpenetration, support
      penetration, or persistent whole-structure drift.
  physics:
  - id: nonpenetrating_contact
    profile: rigid_bodies_and_contact
    dimension: contact_and_interface_conditions
    criterion: During self supporting arch, solid-solid and solid-boundary contacts maintain nonnegative
      geometric gaps up to the contact tolerance and do not permit persistent interpenetration.
    applicability:
      requires:
      - Signed geometric gaps are exported for active and near-contact pairs.
      excludes:
      - Pairs intentionally allowed to pass through or merge.
    numeric_binding:
      calculator: contact.penetration.v1
      inputs:
        signed_distance: fields.contact_signed_distance
        length_scale: scalars.contact_length_scale
      parameters: {}
      reduction:
        type: maximum
  - id: case_constraint_consistency
    profile: rigid_bodies_and_contact
    dimension: kinematic_and_constitutive_constraints
    criterion: The frictional contact and static load-path conditions active in self supporting arch is
      satisfied throughout the intervals where that constraint applies.
    applicability:
      requires:
      - The sampled physical value and prescribed target for the frictional contact and static load-path
        conditions are exported in matching coordinates and units.
      excludes:
      - Intervals in which the constraint is deliberately inactive.
    numeric_binding:
      calculator: constraint.target.v1
      inputs:
        value: fields.constraint_value
        target: fields.constraint_target
        scale: scalars.constraint_scale
      parameters: {}
      reduction:
        type: maximum
  - id: linear_momentum_balance
    profile: rigid_bodies
    dimension: conservation_and_force_balance
    criterion: The time rate of total linear momentum is consistent with the exported external forces;
      internal contact forces cancel in the aggregate.
    applicability:
      requires:
      - Mass, velocity, and external force are exported for every dynamic sample.
      - External forces include gravity, actuators, and prescribed boundary reactions where applicable.
      excludes:
      - Runs with unreported impulses, deleted mass, or unexported external forcing.
    numeric_binding:
      calculator: dynamics.linear_momentum_balance.v1
      inputs:
        mass: state.mass
        velocity: state.velocity
        external_force: fields.external_force
      parameters: {}
      reduction:
        type: maximum
  - id: center_of_mass_consistency
    profile: rigid_bodies
    dimension: kinematic_consistency
    criterion: Each rigid body's mass-weighted center displacement agrees with the time integral
      of its mass-weighted velocity, using trapezoidal quadrature between exported frames.
    applicability:
      requires:
      - Persistent body_id values and positive total mass for every evaluated rigid body.
      - Position, velocity, and mass samples describe the same body mass distribution.
      - Sampling resolves the motion; unresolved impulses can introduce quadrature error.
      excludes:
      - Bodies with mass exchange, changing identity, or inconsistent center-of-mass samples.
    numeric_binding:
      calculator: trajectory.center_of_mass_consistency.v1
      inputs:
        position: state.position
        velocity: state.velocity
        mass: state.mass
        body_id: state.body_id
      parameters:
        displacement_floor: 1.0e-8
      reduction:
        type: rms
