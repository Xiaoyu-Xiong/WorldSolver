id: 091_elastic_rod_static_coiling
title: Static Coiling of an Elastic Rod
category: rods_and_strands
source:
  title: Coiling of elastic rods on rigid substrates
  url: https://www.cs.columbia.edu/cg/elastic_coiling/coiling.pdf
  anchor: Figure 2A and Static Coiling; PDF pages 2-3; Movie S4
goal: 'Recreate the source experiment: Successive deposited portions form nearly circular coils with a consistent
  direction of winding. Use elastic rods or strands; the numerical implementation is unrestricted.'
scene_requirements:
  required_elements:
  - One long, inextensible elastic rod fed downward by a controlled injector.
  - A rigid horizontal substrate below the injector and uniform downward gravity.
  - The source sticking substrate condition for deposited material; no fluid or viscous-thread constitutive
    model.
  - The rod is naturally straight and the substrate remains stationary.
  - Select the naturally straight static-coiling experiment in Figure 2A. Use the source quasi-static regime.
    The source neglects self-contact of the deposited rod; do not add a multilayer collision requirement.
  initial_state:
  - Begin with the rod reaching the substrate before a developed coil has formed.
  required_events:
  - Continued rod injection brings new material to the stationary substrate.
  - The lower suspended portion bends sideways and its contact point moves around a loop.
  - Successive deposited portions form nearly circular coils with a consistent direction of winding.
camera_requirements:
- Use a fixed oblique view that shows the injector, suspended heel, contact point, and deposited pattern; keep
  earlier deposited turns visible.
- Keep the relevant objects visible before loading or contact, during the strongest response, and through the
  stated outcome.
