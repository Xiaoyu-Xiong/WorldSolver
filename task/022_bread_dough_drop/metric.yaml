schema_version: 4
task_id: 022_bread_dough_drop
criteria:
  execution:
  - id: executable_and_evaluable
    criterion: The submitted solver runs to the frozen end time, produces a complete finite trajectory
      with every required evaluation field, and produces a readable platform render without exceeding
      the resource limits.
  visual:
  - id: visible_event_onset
    dimension: event_sequence
    criterion: The bread-dough sample visibly falls toward the ground from its initial configuration.
  - id: visible_interaction_response
    dimension: interaction_response
    criterion: On impact, it compresses vertically and spreads laterally across the support.
  - id: visible_signature_outcome
    dimension: signature_phenomenon
    criterion: After impact, the dough shows limited recovery or continued slow relaxation and approaches
      a stable flattened footprint.
  - id: case_visual_coherence
    dimension: temporal_coherence
    criterion: The dough remains a continuous body without ground penetration, explosive rebound, surface
      popping, or detached material.
  physics:
  - id: material_mass_balance
    profile: deformable_solids
    dimension: conservation_and_source_balance
    criterion: For bread dough drop, the mass change equals the cumulative prescribed inflow, outflow,
      or phase-transfer source; internal motion and contact do not create or delete mass.
    applicability:
      requires:
      - prescribed sources and sinks are exported
      - Per-sample mass contributions are exported for every evaluated material.
      excludes:
      - Unreported particle deletion or remeshing loss.
    numeric_binding:
      calculator: balance.source_aware.v1
      inputs:
        quantity: attributes.mass_quantity
        cumulative_source: fields.cumulative_mass_source
      parameters: {}
      reduction:
        type: maximum
  - id: orientation_preserving_deformation
    profile: deformable_solids
    dimension: deformation_validity
    criterion: Material elements in bread dough drop retain a positive deformation Jacobian except where
      the case explicitly performs a represented topology change.
    applicability:
      requires:
      - A deformation gradient is exported for every active material element.
      excludes:
      - Elements at an explicitly modeled cut, tear, merge, or deletion event after they cease to exist.
    numeric_binding:
      calculator: deformation.jacobian.v1
      inputs:
        deformation_gradient: attributes.deformation_gradient
      parameters: {}
      reduction:
        type: maximum
  - id: nonpenetrating_contact
    profile: deformable_solids
    dimension: contact_and_interface_conditions
    criterion: During bread dough drop, solid-solid and solid-boundary contacts maintain nonnegative geometric
      gaps up to the contact tolerance and do not permit persistent interpenetration.
    applicability:
      requires:
      - Signed geometric gaps are exported for active and near-contact pairs.
      excludes:
      - Pairs intentionally allowed to pass through or merge.
    numeric_binding:
      calculator: contact.penetration.v1
      inputs:
        signed_distance: fields.contact_signed_distance
        length_scale: scalars.contact_length_scale
      parameters: {}
      reduction:
        type: maximum
  - id: linear_momentum_balance
    profile: deformable_solids
    dimension: momentum_and_force_balance
    criterion: For bread dough drop, the time rate of total linear momentum is consistent with the exported
      external forces; internal forces may redistribute momentum but cancel in the total balance.
    applicability:
      requires:
      - Mass, velocity, and all external forces are exported at the trajectory sampling times.
      excludes:
      - Frames spanning an unreported impulsive external intervention.
    numeric_binding:
      calculator: dynamics.linear_momentum_balance.v1
      inputs:
        mass: state.mass
        velocity: state.velocity
        external_force: fields.external_force
      parameters: {}
      reduction:
        type: maximum
