id: 122_wetted_porous_plug_funnel
title: A Wetted Porous Plug Softens and Passes through a Funnel
category: multiphysics_coupling
source:
  title: Multiphase Particle-Based Simulation of Poro-Elasto-Capillary Effects
  url: https://webspace.science.uu.nl/~telea001/uploads/Bibtex/li25_multiphase.pdf
  anchor: Figure 8, right-hand wet-softening case; PDF page 10; Section 6.1 on page 7
goal: 'Recreate the source two-way coupled experiment: The softened plug squeezes through the narrow throat
  and moves below the funnel. Prescribe only the stated supports and controls; the remaining solid response
  and fluid motion must be dynamically coupled.'
scene_requirements:
  required_elements:
  - A deformable porous plug initially supported at the throat of a rigid funnel.
  - Liquid introduced above the plug, with wetting-dependent softening.
  - Gravity, plug-funnel contact, and space to observe passage below the throat.
  - Fluid forces must change the dynamic solid motion or deformation, and the evolving solid must alter the
    resolved fluid flow. The numerical coupling method is unrestricted.
  - Wetting changes the frozen constitutive response according to the source; do not implement passage by shrinking
    the plug or widening the funnel.
  initial_state:
  - The initially stiff plug is too large to pass through the throat without deformation.
  - Start before liquid wetting; use the softening case on the right of Figure 8, not the rigid-plug comparison.
  required_events:
  - The plug initially remains caught at the funnel throat.
  - After the arriving liquid wets it, the plug deforms progressively against the opening.
  - The softened plug squeezes through the narrow throat and moves below the funnel.
camera_requirements:
- Use a fixed side-oblique view with a transparent or cutaway funnel rendering, keeping the incoming liquid,
  throat, and region below visible.
- Keep the onset, strongest interaction, and stated outcome visible in a continuous sequence. Passive tracer
  or wetness colors must follow the simulated state rather than a scripted color change.
