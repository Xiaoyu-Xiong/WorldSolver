id: 096_rod_knot_tightening
title: Tightening a Frictionless Elastic Rod Knot
category: rods_and_strands
source:
  title: A Nonsmooth Newton Solver for Capturing Exact Coulomb Friction in Fiber Assemblies
  url: https://elan.inrialpes.fr/people/bertails/Papiers/PDF/hairContact.pdf
  anchor: Figure 6; Section 5.1.1; author PDF page 9
goal: 'Recreate the source experiment: The strand forms a compact, tightly contacting knot between its tails.
  Use elastic rods or strands; the numerical implementation is unrestricted.'
scene_requirements:
  required_elements:
  - One finite-thickness, inextensible elastic strand with bending resistance.
  - Endpoint manipulation that forms and tightens the source knot.
  - Frictionless self-contact, as specified for Figure 6.
  - This case uses the zero-friction Figure 6 configuration, not a friction-locked knot.
  initial_state:
  - Begin with a loose loop and a visible strand end that can be threaded through it.
  required_events:
  - The manipulated strand end passes through the loose loop to form a knot.
  - Pulling the tails draws the contacting portions together and shrinks the main loop.
  - The strand forms a compact, tightly contacting knot between its tails.
camera_requirements:
- Keep the full knot and both tails visible; use a view that distinguishes over- and under-passing portions.
- Keep the relevant objects visible before loading or contact, during the strongest response, and through the
  stated outcome.
