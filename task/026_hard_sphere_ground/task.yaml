id: 026_hard_sphere_ground
title: Hard Sphere Ground
category: elastic_solids
source:
  title: Optimization Integrator for Large Time Steps
  url: https://math.ucdavis.edu/~jteran/papers/GSSJT15.pdf
  anchor: Figure 10; PDF page 10
goal: Recreate the observable physical phenomenon in which a stiff deformable sphere impacts the ground
  at high speed, undergoes bounded compression, rebounds or settles, and avoids visible penetration. The
  implementation method is unrestricted; the target is the scene's visible motion, interaction, and outcome.
scene_requirements:
  required_elements:
  - Hard Sphere Ground
  - Deformable object named by the scene
  - Collision obstacles or supports
  - Gravity
  initial_state:
  - A stiff deformable sphere impacts the ground at high speed, undergoes bounded compression, rebounds
    or settles, and avoids visible penetration.
  required_events:
  - Quantitative/qualitative - penetration
  - Inversion during recovery
  - Rebound
  - Convergence
camera_requirements:
- Use a three-quarter view showing the full deformable body, loading or impact region, contacts, large
  deformation, and recovered or final shape.
parameter_notes:
- 'Merged source variants (hard_sphere_ground_constraint, hard_sphere_ground_postprocess). Original paper
  parameters/configurations: dt = 1/24 s; collision method = constraint; identical sphere drop. | dt =
  1/24 s; collision method = postprocess; identical sphere drop.'
