id: 111_elastic_bag_lift_sloshing
title: A Lifted Elastic Bag Carries and Spills Water
category: multiphysics_coupling
source:
  title: Two-way Coupling of Fluids to Rigid and Deformable Solids and Shells
  url: https://www.cs.ucr.edu/~shinar/papers/2008_solid_fluid.pdf
  anchor: Figure 11; PDF page 7
goal: 'Recreate the source two-way coupled experiment: The contained water sloshes and some of it spills over
  the rim back toward the pool. Prescribe only the stated supports and controls; the remaining solid response
  and fluid motion must be dynamically coupled.'
scene_requirements:
  required_elements:
  - An open impermeable elastic cloth bag initially submerged in a water pool.
  - A rim lifting control and enough space above the pool for the raised bag.
  - Gravity and dynamic water inside and outside the bag.
  - Fluid forces must change the dynamic solid motion or deformation, and the evolving solid must alter the
    resolved fluid flow. The numerical coupling method is unrestricted.
  - Only the rim motion is prescribed. Do not animate the bag expansion or the contained liquid as a rigid
    attachment.
  initial_state:
  - Initialize the source submerged bag containing pool water.
  - Lift the rim quickly, then hold it, allowing the rest of the bag and liquid to respond dynamically.
  required_events:
  - The bag rises out of the pool while carrying water inside its opening.
  - The lifted bag bounces and alternately expands and contracts.
  - The contained water sloshes and some of it spills over the rim back toward the pool.
camera_requirements:
- Use a fixed oblique side view showing the pool surface, rim trajectory, full bag, and any water spilling
  over the opening.
- Keep the onset, strongest interaction, and stated outcome visible in a continuous sequence. Passive tracer
  or wetness colors must follow the simulated state rather than a scripted color change.
