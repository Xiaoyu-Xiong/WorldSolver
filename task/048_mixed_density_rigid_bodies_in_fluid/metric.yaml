schema_version: 4
task_id: 048_mixed_density_rigid_bodies_in_fluid
criteria:
  execution:
  - id: executable_and_evaluable
    criterion: The submitted solver runs to the frozen end time, produces a complete finite trajectory
      with every required evaluation field, and produces a readable platform render without exceeding
      the resource limits.
  visual:
  - id: visible_event_onset
    dimension: event_sequence
    criterion: The immersed rigid bodies visibly begin to separate into different vertical trajectories
      after release.
  - id: visible_interaction_response
    dimension: interaction_response
    criterion: Low-density bodies rise while high-density bodies sink, with intermediate bodies showing
      visibly different buoyant or settling behavior.
  - id: visible_signature_outcome
    dimension: signature_phenomenon
    criterion: Marker particles move around the bodies and reveal a fluid response to their motion rather
      than passing through them.
  - id: case_visual_coherence
    dimension: temporal_coherence
    criterion: Each rigid body preserves shape and moves continuously without fluid-solid tunneling, teleportation,
      or density-independent identical motion.
  physics:
  - id: material_mass_balance
    profile: multiphysics_coupling
    dimension: conservation_and_source_balance
    criterion: For each conserved material, the mass change equals the cumulative prescribed inflow, outflow,
      or phase-transfer source; internal motion and contact do not create or delete mass.
    applicability:
      requires:
      - prescribed sources and sinks are exported
      - Per-sample mass contributions are exported for every evaluated material.
      excludes:
      - Unreported particle deletion or remeshing loss.
    numeric_binding:
      calculator: balance.source_aware.v1
      inputs:
        quantity: attributes.mass_quantity
        cumulative_source: fields.cumulative_mass_source
      parameters: {}
      reduction:
        type: maximum
  - id: linear_momentum_balance
    profile: multiphysics_coupling
    dimension: momentum_and_force_balance
    criterion: For mixed density rigid bodies in fluid, the time rate of total linear momentum is consistent
      with the exported external forces; internal forces may redistribute momentum but cancel in the total
      balance.
    applicability:
      requires:
      - Mass, velocity, and all external forces are exported at the trajectory sampling times.
      excludes:
      - Frames spanning an unreported impulsive external intervention.
    numeric_binding:
      calculator: dynamics.linear_momentum_balance.v1
      inputs:
        mass: state.mass
        velocity: state.velocity
        external_force: fields.external_force
      parameters: {}
      reduction:
        type: maximum
  - id: internal_coupling_force_balance
    profile: multiphysics_coupling
    dimension: multiphysics_exchange_balance
    criterion: The paired internal interaction forces exchanged between materials in mixed density rigid
      bodies in fluid are equal and opposite in the aggregate.
    applicability:
      requires:
      - Both sides of every internal coupling or contact force pair are exported.
      excludes:
      - External actuator, gravity, or boundary reaction forces.
    numeric_binding:
      calculator: coupling.force_balance.v1
      inputs:
        interaction_force: fields.interaction_force
      parameters: {}
      reduction:
        type: maximum
  - id: incompressible_velocity_constraint
    profile: multiphysics_coupling
    dimension: field_constraints
    criterion: In the active incompressible region of the incompressible fluid, the velocity field is
      approximately divergence free.
    applicability:
      requires:
      - The frozen material model is incompressible.
      - A collocated velocity grid and active-region mask are exported.
      excludes:
      - Compressible material regions and prescribed source cells.
    numeric_binding:
      calculator: field.divergence.v1
      inputs:
        velocity_field: fields.velocity_field
        active_mask: fields.active_mask
        grid_spacing: scalars.grid_spacing
        characteristic_length: scalars.characteristic_length
      parameters:
        spatial_dimensions: 3
      reduction:
        type: maximum
