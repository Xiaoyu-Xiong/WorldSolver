id: 110_elastic_bag_filling_overflow
title: An Elastic Bag Fills and Overflows
category: multiphysics_coupling
source:
  title: Two-way Coupling of Fluids to Rigid and Deformable Solids and Shells
  url: https://www.cs.ucr.edu/~shinar/papers/2008_solid_fluid.pdf
  anchor: Figure 10; PDF page 6
goal: 'Recreate the source two-way coupled experiment: Water reaches the rim, overflows the opening, and runs
  down the outside of the bag. Prescribe only the stated supports and controls; the remaining solid response
  and fluid motion must be dynamically coupled.'
scene_requirements:
  required_elements:
  - An open elastic impermeable cloth bag suspended by its rim.
  - A water nozzle above the opening and a resolved free-surface liquid domain.
  - Gravity, fixed rim supports, and space for exterior overflow.
  - Fluid forces must change the dynamic solid motion or deformation, and the evolving solid must alter the
    resolved fluid flow. The numerical coupling method is unrestricted.
  initial_state:
  - Start with the source unfilled bag beneath the nozzle.
  - The source elastic response allows an impact deflection followed by recovery and expansion as water accumulates.
  required_events:
  - The incoming water first strikes the bag interior and visibly deforms its bottom.
  - The bag recoils from the impact and then expands as it fills.
  - Water reaches the rim, overflows the opening, and runs down the outside of the bag.
camera_requirements:
- Use a fixed oblique side view that exposes the opening, water level, bag silhouette, and exterior overflow.
- Keep the onset, strongest interaction, and stated outcome visible in a continuous sequence. Passive tracer
  or wetness colors must follow the simulated state rather than a scripted color change.
