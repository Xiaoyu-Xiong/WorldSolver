schema_version: 4
task_id: 147_bike_chain_kinematic_sprocket
criteria:
  execution:
  - id: executable_and_evaluable
    criterion: The solver reaches the frozen end time, exports every required finite trajectory field, and produces a readable render within resource limits.
  visual:
  - id: visible_event_onset
    dimension: event_sequence
    criterion: The driven sprocket begins rotating and engages successive links.
  - id: visible_interaction_response
    dimension: interaction_response
    criterion: Tension and contact pull the chain around both sprockets while links articulate through the straight and curved runs.
  - id: visible_signature_outcome
    dimension: signature_phenomenon
    criterion: The follower sprocket rotates coherently for multiple cycles without chain derailment, stretch, or tooth penetration.
  - id: case_visual_coherence
    dimension: temporal_coherence
    criterion: Bodies preserve rigid shape and move continuously without teleportation, persistent interpenetration, disconnected joints, or numerical explosion.
  physics:
  - id: nonpenetrating_contact
    profile: rigid_bodies_and_contact
    dimension: contact_and_interface_conditions
    criterion: Active rigid contacts maintain nonnegative geometric gaps up to the frozen contact tolerance.
    applicability:
      requires:
      - Signed gaps are exported for active and near-contact pairs.
      excludes:
      - Pairs intentionally allowed to pass through or merge.
    numeric_binding:
      calculator: contact.penetration.v1
      inputs:
        signed_distance: fields.contact_signed_distance
        length_scale: scalars.contact_length_scale
      parameters: {}
      reduction:
        type: maximum
  - id: linear_momentum_balance
    profile: rigid_bodies_and_contact
    dimension: momentum_and_force_balance
    criterion: The time rate of total linear momentum is consistent with all exported external forces.
    applicability:
      requires:
      - Mass, velocity, and external forces are exported at trajectory samples.
      excludes:
      - Frames spanning an unreported external impulse.
    numeric_binding:
      calculator: dynamics.linear_momentum_balance.v1
      inputs:
        mass: state.mass
        velocity: state.velocity
        external_force: fields.external_force
      parameters: {}
      reduction:
        type: maximum
  - id: center_of_mass_consistency
    profile: rigid_bodies
    dimension: kinematic_consistency
    criterion: Each rigid body's center displacement agrees with the time integral of its mass-weighted velocity.
    applicability:
      requires:
      - Persistent body IDs and collocated position, velocity, and mass samples are exported.
      excludes:
      - Bodies with mass exchange or changing identity.
    numeric_binding:
      calculator: trajectory.center_of_mass_consistency.v1
      inputs:
        position: state.position
        velocity: state.velocity
        mass: state.mass
        body_id: state.body_id
      parameters:
        displacement_floor: 1.0e-8
      reduction:
        type: rms
  - id: internal_interaction_force_balance
    profile: coupled_contact_systems
    dimension: conservation_and_force_balance
    criterion: Exported paired internal contact and joint forces are equal and opposite in aggregate.
    applicability:
      requires:
      - Both sides of every evaluated internal interaction-force pair are exported.
      excludes:
      - Gravity, fixed-support reactions, motors, and other one-sided external forces.
    numeric_binding:
      calculator: coupling.force_balance.v1
      inputs:
        interaction_force: fields.interaction_force
      parameters: {}
      reduction:
        type: maximum

