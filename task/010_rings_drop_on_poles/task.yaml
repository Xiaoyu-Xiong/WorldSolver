id: 010_rings_drop_on_poles
title: Rings Drop On Poles
category: rigid_body_dynamics
source:
  title: Nonconvex Rigid Bodies with Stacking
  url: https://graphics.stanford.edu/papers/rigid_bodies-sig03/rigid_bodies.pdf
  anchor: Figure 1; PDF page 1
goal: Recreate the observable physical phenomenon in which a large collection of nonconvex rings falls
  over an array of vertical poles and settles into an interlocked pile. The implementation method is unrestricted;
  the target is the scene's visible motion, interaction, and outcome.
scene_requirements:
  required_elements:
  - Receiving pile region
  - Rigid bodies named by the scene
  - Contact surfaces
  - Gravity
  initial_state:
  - A large collection of nonconvex rings falls over an array of vertical poles and settles into an interlocked
    pile.
  required_events:
  - Qualitative/quantitative - penetration count
  - Contact stability
  - Settled height
  - Residual kinetic energy
  - Runtime per frame
camera_requirements:
- Use a three-quarter view that exposes the important contact points, stack or mechanism, support surfaces,
  and final configuration throughout the motion.
parameter_notes:
- 'Original paper parameters/configuration: Use the paper''s nonconvex ring meshes and pole array; the
  Results section reports separate large tests with 500 and 1,000 rings.'
