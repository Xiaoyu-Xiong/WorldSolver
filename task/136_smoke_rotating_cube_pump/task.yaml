id: 136_smoke_rotating_cube_pump
title: Smoke Driven by a Rotating Cube Pump
category: fluid_dynamics
source:
  title: Visual Simulation of Smoke
  url: https://graphics.stanford.edu/~henrik/papers/smoke/smoke.pdf
  anchor: Figure 6
goal: >-
  Recreate the paper's clearly visible smoke driven by a rotating cube pump phenomenon. The implementation method is unrestricted;
  evaluation targets the observable flow evolution, boundary interaction, signature structure, and final state.
scene_requirements:
  required_elements:
  - Smoke source
  - Rotating cube-shaped obstacle
  - Enclosed flow domain
  - Buoyancy and moving boundaries
  initial_state:
  - Smoke begins near the lower region while a cube rotates with prescribed motion.
  required_events:
  - New smoke rises into the velocity field generated by the rotating cube.
  - The moving cube deflects the plume and pumps it into pronounced rolling vortices.
  - Smoke wraps around the cube and forms coherent trailing structures that remain advected by the flow.
  - The represented fluid remains continuous and respects rigid boundaries throughout the event.
camera_requirements:
- Use a wide three-quarter view showing the cube, source, and full smoke wake.
- Use contrasting fluid and obstacle colors and keep the complete phenomenon inside frame.
parameter_notes:
- Match the qualitative scale, flow regime, and event ordering shown in Figure 6; geometric simplification is allowed.
- Export collocated velocity diagnostics, active masks, boundary samples, and transported liquid or smoke fields.

