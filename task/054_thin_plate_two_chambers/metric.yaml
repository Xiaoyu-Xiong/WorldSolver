schema_version: 4
task_id: 054_thin_plate_two_chambers
criteria:
  execution:
  - id: executable_and_evaluable
    criterion: The submitted solver runs to the frozen end time, produces a complete finite trajectory
      with every required evaluation field, and produces a readable platform render without exceeding
      the resource limits.
  visual:
  - id: visible_event_onset
    dimension: event_sequence
    criterion: The incoming jet visibly develops within the lower chamber of the two-dimensional domain.
  - id: visible_interaction_response
    dimension: interaction_response
    criterion: On reaching the thin separating plate, the jet is redirected within the lower chamber rather
      than passing through the plate.
  - id: visible_signature_outcome
    dimension: signature_phenomenon
    criterion: The lower chamber develops a visible deflected wake or recirculating flow while the upper
      chamber remains free of leaked jet material.
  - id: case_visual_coherence
    dimension: temporal_coherence
    criterion: The plate boundary remains visually effective without cross-plate popping, flickering fluid,
      disconnected material, or unstable boundary artifacts.
  physics:
  - id: material_mass_balance
    profile: multiphysics_coupling
    dimension: conservation_and_source_balance
    criterion: For the jet fluid, the mass change equals the cumulative prescribed inflow, outflow, or
      phase-transfer source; internal motion and contact do not create or delete mass.
    applicability:
      requires:
      - prescribed sources and sinks are exported
      - Per-sample mass contributions are exported for every evaluated material.
      excludes:
      - Unreported particle deletion or remeshing loss.
    numeric_binding:
      calculator: balance.source_aware.v1
      inputs:
        quantity: attributes.mass_quantity
        cumulative_source: fields.cumulative_mass_source
      parameters: {}
      reduction:
        type: maximum
  - id: incompressible_velocity_constraint
    profile: multiphysics_coupling
    dimension: field_constraints
    criterion: In the active incompressible region of the incompressible fluid, the velocity field is
      approximately divergence free.
    applicability:
      requires:
      - The frozen material model is incompressible.
      - A collocated velocity grid and active-region mask are exported.
      excludes:
      - Compressible material regions and prescribed source cells.
    numeric_binding:
      calculator: field.divergence.v1
      inputs:
        velocity_field: fields.velocity_field
        active_mask: fields.active_mask
        grid_spacing: scalars.grid_spacing
        characteristic_length: scalars.characteristic_length
      parameters:
        spatial_dimensions: 2
      reduction:
        type: maximum
  - id: internal_coupling_force_balance
    profile: multiphysics_coupling
    dimension: multiphysics_exchange_balance
    criterion: The paired internal interaction forces exchanged between materials in thin plate two chambers
      are equal and opposite in the aggregate.
    applicability:
      requires:
      - Both sides of every internal coupling or contact force pair are exported.
      excludes:
      - External actuator, gravity, or boundary reaction forces.
    numeric_binding:
      calculator: coupling.force_balance.v1
      inputs:
        interaction_force: fields.interaction_force
      parameters: {}
      reduction:
        type: maximum
  - id: prescribed_boundary_velocity
    profile: multiphysics_coupling
    dimension: boundary_and_interface_conditions
    criterion: At impermeable or moving boundaries in thin plate two chambers, the sampled material velocity
      matches the prescribed normal boundary velocity.
    applicability:
      requires:
      - Boundary velocity, target velocity, and normals are exported at collocated samples.
      excludes:
      - Open, porous, or prescribed-flux boundary segments.
    numeric_binding:
      calculator: boundary.velocity_residual.v1
      inputs:
        boundary_velocity: fields.boundary_velocity
        boundary_target_velocity: fields.boundary_target_velocity
        boundary_normal: fields.boundary_normal
        reference_velocity: scalars.reference_velocity
      parameters:
        condition: no_penetration
      reduction:
        type: maximum
