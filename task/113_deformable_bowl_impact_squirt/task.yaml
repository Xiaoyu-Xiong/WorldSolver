id: 113_deformable_bowl_impact_squirt
title: A Liquid-Filled Deformable Bowl Impacts and Squirts
category: multiphysics_coupling
source:
  title: Simultaneous Coupling of Fluids and Deformable Bodies
  url: https://graphics.berkeley.edu/papers/Chentanez-SCP-2006-08/index.html
  anchor: Figure 5; PDF page 5; Section 4.1 continues on page 6
goal: 'Recreate the source two-way coupled experiment: Liquid squirts through the bowl opening and disturbs
  the surrounding shallow water. Prescribe only the stated supports and controls; the remaining solid response
  and fluid motion must be dynamically coupled.'
scene_requirements:
  required_elements:
  - An open deformable impermeable bowl containing liquid in the source orientation.
  - A shallow water layer in a rigid tank beneath the bowl.
  - Gravity and bowl-tank collision response.
  - Fluid forces must change the dynamic solid motion or deformation, and the evolving solid must alter the
    resolved fluid flow. The numerical coupling method is unrestricted.
  initial_state:
  - The filled bowl is above the shallow water before its fall and impact.
  - Keep the source open shape; do not replace the bowl with a sealed balloon or a rigid cube.
  required_events:
  - The liquid-filled bowl falls into the shallow water and reaches the tank bottom.
  - Bottom contact compresses and tilts the bowl instead of leaving its shape rigid.
  - Liquid squirts through the bowl opening and disturbs the surrounding shallow water.
camera_requirements:
- Use a fixed oblique side view with transparent tank walls, exposing the bowl opening, bottom contact, and
  surrounding water.
- Keep the onset, strongest interaction, and stated outcome visible in a continuous sequence. Passive tracer
  or wetness colors must follow the simulated state rather than a scripted color change.
