id: 119_porous_sponge_absorption_swelling
title: A Porous Sponge Absorbs Water and Swells
category: multiphysics_coupling
source:
  title: Multiphase Particle-Based Simulation of Poro-Elasto-Capillary Effects
  url: https://webspace.science.uu.nl/~telea001/uploads/Bibtex/li25_multiphase.pdf
  anchor: Figure 5; PDF page 10; Section 6.1 on page 7
goal: 'Recreate the source two-way coupled experiment: The sponge outline gradually expands as liquid is absorbed.
  Prescribe only the stated supports and controls; the remaining solid response and fluid motion must be dynamically
  coupled.'
scene_requirements:
  required_elements:
  - A deformable porous sponge block in contact with a finite water block on its right side.
  - A wetting and poroelastic swelling model, with pore-liquid storage and pressure.
  - A support surface and gravity.
  - Fluid forces must change the dynamic solid motion or deformation, and the evolving solid must alter the
    resolved fluid flow. The numerical coupling method is unrestricted.
  - Use a low pore-Reynolds-number interval with resolved porous interior samples for the Darcy diagnostic,
    including the swelling-induced solid velocity.
  initial_state:
  - The sponge begins dry as in Figure 5, with water outside its right-hand face.
  - Choose the source absorption-driven swelling regime; no external actuator expands the sponge.
  required_events:
  - Water enters the sponge from the side that touches the right-hand water block.
  - The wet region advances inward from that contact side rather than appearing throughout the whole sponge
    at once.
  - The sponge outline gradually expands as liquid is absorbed.
camera_requirements:
- Use a fixed oblique view of the sponge outline and adjacent water; any wetness shading must follow exported
  local liquid saturation.
- Keep the onset, strongest interaction, and stated outcome visible in a continuous sequence. Passive tracer
  or wetness colors must follow the simulated state rather than a scripted color change.
