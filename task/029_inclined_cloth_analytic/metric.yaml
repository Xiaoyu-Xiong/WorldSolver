schema_version: 4
task_id: 029_inclined_cloth_analytic
criteria:
  execution:
  - id: executable_and_evaluable
    criterion: The submitted solver runs to the frozen end time, produces a complete finite trajectory
      with every required evaluation field, and produces a readable platform render without exceeding
      the resource limits.
  visual:
  - id: visible_event_onset
    dimension: event_sequence
    criterion: The initially plane-parallel cloth sheet visibly falls onto the inclined surface.
  - id: visible_interaction_response
    dimension: interaction_response
    criterion: Contact spreads across the sheet without a large bounce or missed collision.
  - id: visible_signature_outcome
    dimension: signature_phenomenon
    criterion: The cloth then slides downslope as a coherent sheet while developing plausible local folds.
  - id: case_visual_coherence
    dimension: temporal_coherence
    criterion: The cloth does not visibly penetrate the plane, snag without cause, teleport, or undergo
      an unexplained global flip.
  physics:
  - id: material_mass_balance
    profile: cloth_thin_shells_and_fibers
    dimension: conservation_and_source_balance
    criterion: For inclined cloth analytic, the mass change equals the cumulative prescribed inflow, outflow,
      or phase-transfer source; internal motion and contact do not create or delete mass.
    applicability:
      requires:
      - prescribed sources and sinks are exported
      - Per-sample mass contributions are exported for every evaluated material.
      excludes:
      - Unreported particle deletion or remeshing loss.
    numeric_binding:
      calculator: balance.source_aware.v1
      inputs:
        quantity: attributes.mass_quantity
        cumulative_source: fields.cumulative_mass_source
      parameters: {}
      reduction:
        type: maximum
  - id: nonpenetrating_contact
    profile: cloth_thin_shells_and_fibers
    dimension: contact_and_interface_conditions
    criterion: During inclined cloth analytic, solid-solid and solid-boundary contacts maintain nonnegative
      geometric gaps up to the contact tolerance and do not permit persistent interpenetration.
    applicability:
      requires:
      - Signed geometric gaps are exported for active and near-contact pairs.
      excludes:
      - Pairs intentionally allowed to pass through or merge.
    numeric_binding:
      calculator: contact.penetration.v1
      inputs:
        signed_distance: fields.contact_signed_distance
        length_scale: scalars.contact_length_scale
      parameters: {}
      reduction:
        type: maximum
  - id: case_constraint_consistency
    profile: cloth_thin_shells_and_fibers
    dimension: kinematic_and_constitutive_constraints
    criterion: The inclined-plane Coulomb friction condition active in inclined cloth analytic is satisfied
      throughout the intervals where that constraint applies.
    applicability:
      requires:
      - The sampled physical value and prescribed target for the inclined-plane Coulomb friction condition
        are exported in matching coordinates and units.
      excludes:
      - Intervals in which the constraint is deliberately inactive.
    numeric_binding:
      calculator: constraint.target.v1
      inputs:
        value: fields.constraint_value
        target: fields.constraint_target
        scale: scalars.constraint_scale
      parameters: {}
      reduction:
        type: maximum
  - id: orientation_preserving_deformation
    profile: deformable_materials
    dimension: deformation_constraints
    criterion: Material elements retain a positive deformation Jacobian except where the case explicitly
      performs a represented topology change.
    applicability:
      requires:
      - A deformation gradient is exported for every active material element.
      excludes:
      - Elements belonging to an explicitly modeled tear, cut, merge, or remeshing event.
    numeric_binding:
      calculator: deformation.jacobian.v1
      inputs:
        deformation_gradient: attributes.deformation_gradient
      parameters: {}
      reduction:
        type: maximum
