schema_version: 1
units: meters
up_axis: z
objects:
  - id: tank_floor
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [1.03, 1.03, 0.025]}
    transform: {translation: [0.0, 0.0, -0.025]}
    material_id: matte
    collision_enabled: true
  - id: left_wall
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.015, 1.03, 0.6]}
    transform: {translation: [-1.015, 0.0, 0.6]}
    material_id: matte
    collision_enabled: true
  - id: right_wall
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.015, 1.03, 0.6]}
    transform: {translation: [1.015, 0.0, 0.6]}
    material_id: matte
    collision_enabled: true
  - id: lower_wall
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [1.0, 0.015, 0.6]}
    transform: {translation: [0.0, -1.015, 0.6]}
    material_id: matte
    collision_enabled: true
  - id: upper_wall
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [1.0, 0.015, 0.6]}
    transform: {translation: [0.0, 1.015, 0.6]}
    material_id: matte
    collision_enabled: true
  - id: octagonal_obstacle
    semantic: boundary
    motion: static
    geometry: {type: triangle_mesh, asset: assets/octagonal_obstacle.obj}
    material_id: matte
    collision_enabled: true
  - id: water_height_samples
    semantic: liquid
    motion: dynamic
    geometry:
      type: particle_domain
      bounds_min: [-1.0, -1.0, 0.0]
      bounds_max: [1.0, 1.0, 1.2]
      grid_shape: [64, 64, 1]
    state_binding: {selector: all}
    material_id: default
    collision_enabled: false
