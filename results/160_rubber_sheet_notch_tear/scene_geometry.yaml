schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [2.4, 2.0, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: ground
    collision_enabled: true
  - id: grip_left
    semantic: boundary
    motion: kinematic
    geometry: {type: box, half_extents: [0.12,0.18,1.25]}
    transform: {translation: [-1.5,0,1.60], rotation_xyzw: [0,0,0,1]}
    material_id: obstacle
    collision_enabled: true
  - id: grip_right
    semantic: boundary
    motion: kinematic
    geometry: {type: box, half_extents: [0.12,0.18,1.25]}
    transform: {translation: [1.5,0,1.60], rotation_xyzw: [0,0,0,1]}
    material_id: obstacle
    collision_enabled: true
  - id: cloth
    semantic: cloth
    motion: dynamic
    geometry: {type: triangle_mesh, topology_asset: assets/cloth_topology.json, grid_shape: [17, 17]}
    state_binding: {selector: all}
    material_id: cloth
    collision_enabled: true
