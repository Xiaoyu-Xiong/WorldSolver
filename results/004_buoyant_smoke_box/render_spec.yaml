schema_version: 2
profile: gas_volume
environment: studio_neutral
camera: frozen_config
bindings:
  - object_id: closed_box
    method: rigid_mesh
    material: matte
    color_rgb: [0.30, 0.36, 0.42]
    wireframe: true
  - object_id: smoke_field
    method: volume
    material: default
    color_rgb: [0.68, 0.70, 0.72]
    volume_mode: slices
    volume_axis: 1
    density_scale: 5.0
  - object_id: passive_markers
    method: diagnostic_points
    material: default
    color_rgb: [0.65, 0.65, 0.65]
    opacity: 0.03
    max_points: 1200
    particle_radius_scale: 0.55
  - object_id: heat_source
    method: rigid_mesh
    material: default
    color_rgb: [0.85, 0.28, 0.07]
