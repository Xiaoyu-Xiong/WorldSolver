schema_version: 1
units: meters
up_axis: z
objects:
  - id: floor
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [3.2, 2.2, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: floor_matte
    collision_enabled: true

  # Lower A-frames. Cards are 0.90 x 0.36 x 0.03 m rigid boxes.
  - id: card_lower_left_outer
    semantic: rigid
    motion: dynamic
    geometry: {type: box, half_extents: [0.45, 0.18, 0.015]}
    transform: {translation: [-0.925, 0.0, 0.397], rotation_xyzw: [0.0, -0.5, 0.0, 0.8660254]}
    state_binding: {selector: body_id, value: 0}
    material_id: card_red
  - id: card_lower_left_inner
