schema_version: 1
units: meters
up_axis: z
objects:
  - id: floor
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [3.2, 2.2, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: floor
    collision_enabled: true
  - id: guide_lower
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [1.05, 0.52, 0.08]}
    transform: {translation: [1.15, 0.0, 0.55]}
    material_id: guide
    collision_enabled: true
  - id: guide_upper
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [1.05, 0.52, 0.08]}
    transform: {translation: [1.15, 0.0, 1.45]}
    material_id: guide
    collision_enabled: true
  - id: crank_axle
    semantic: boundary
    motion: static
    geometry: {type: cylinder, radius: 0.13, height: 0.42}
    transform: {translation: [-0.8, 0.0, 1.0], rotation_xyzw: [0.7071068, 0.0, 0.0, 0.7071068]}
    material_id: axle
    collision_enabled: true
  - id: crank
    semantic: rigid
    motion: dynamic
    geometry: {type: triangle_mesh, asset: assets/crank.obj}
    transform: {translation: [-0.8,0,1], rotation_xyzw: [0,0,0,1]}
    state_binding: {selector: body_id, value: 0}
    material_id: accent_a
    collision_enabled: true
  - id: rod
    semantic: rigid
    motion: dynamic
    geometry: {type: triangle_mesh, asset: assets/connecting_rod.obj}
    transform: {translation: [0,0,1], rotation_xyzw: [0,0,0,1]}
    state_binding: {selector: body_id, value: 1}
    material_id: accent_b
    collision_enabled: true
  - id: piston
    semantic: rigid
    motion: dynamic
    geometry: {type: triangle_mesh, asset: assets/piston.obj}
    transform: {translation: [1.15,0,1], rotation_xyzw: [0,0,0,1]}
    state_binding: {selector: body_id, value: 2}
    material_id: accent_a
    collision_enabled: true
