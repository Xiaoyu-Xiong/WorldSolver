schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [2.4, 2.0, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: ground
    collision_enabled: true
  - id: limb_upper
    semantic: boundary
    motion: kinematic
    geometry: {type: capsule, radius: 0.34, height: 1.3}
    transform: {translation: [-0.62, 0.0, 1.10], rotation_xyzw: [0.0, 0.7071068, 0.0, 0.7071068]}
    material_id: obstacle
    collision_enabled: true
  - id: limb_lower
    semantic: boundary
    motion: kinematic
    geometry: {type: capsule, radius: 0.31, height: 1.3}
    transform: {translation: [0.62, 0.0, 1.10], rotation_xyzw: [0.0, 0.7071068, 0.0, 0.7071068]}
    material_id: obstacle
    collision_enabled: true
  - id: knee_joint
    semantic: boundary
    motion: kinematic
    geometry: {type: sphere, radius: 0.36}
    transform: {translation: [0.0, 0.0, 1.10]}
    material_id: skin
    collision_enabled: true
  - id: foot
    semantic: boundary
    motion: kinematic
    geometry: {type: capsule, radius: 0.25, height: 0.72}
    transform: {translation: [1.55, -0.10, 0.92], rotation_xyzw: [0.0, 0.7071068, 0.0, 0.7071068]}
    material_id: skin
    collision_enabled: true
  - id: cloth
    semantic: cloth
    motion: dynamic
    geometry: {type: triangle_mesh, topology_asset: assets/cloth_topology.json, grid_shape: [17, 17]}
    state_binding: {selector: all}
    material_id: cloth
    collision_enabled: true
