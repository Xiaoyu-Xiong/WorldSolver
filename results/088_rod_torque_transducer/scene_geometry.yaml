schema_version: 1
units: meters
up_axis: z
objects:
  - id: torsion_rod
    semantic: fiber
    motion: dynamic
    geometry:
      type: curve_network
      radius: 0.018
      topology_asset: assets/rod_topology.json
    state_binding:
      selector: attribute
      attribute_name: component_id
      value: 0
    material_id: striped_rod
    collision_enabled: false
  - id: driven_body
    semantic: rigid
    motion: dynamic
    geometry:
      type: cylinder
      radius: 0.15
      height: 0.20
    transform:
      rotation_xyzw: [0.0, 0.70710678, 0.0, 0.70710678]
    state_binding: {selector: body_id, value: 1}
    material_id: driven_blue
    collision_enabled: false
  - id: receiver_body
    semantic: rigid
    motion: dynamic
    geometry:
      type: cylinder
      radius: 0.095
      height: 0.16
    transform:
      rotation_xyzw: [0.0, 0.70710678, 0.0, 0.70710678]
    state_binding: {selector: body_id, value: 2}
    material_id: receiver_blue
    collision_enabled: false
  - id: driven_orientation_mark
    semantic: rigid
    motion: dynamic
    geometry:
      type: box
      half_extents: [0.012, 0.018, 0.12]
    state_binding: {selector: body_id, value: 3}
    material_id: orientation_mark
    collision_enabled: false
  - id: receiver_orientation_mark
    semantic: rigid
    motion: dynamic
    geometry:
      type: box
      half_extents: [0.010, 0.014, 0.072]
    state_binding: {selector: body_id, value: 4}
    material_id: orientation_mark
    collision_enabled: false
