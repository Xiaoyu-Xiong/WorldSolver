schema_version: 1
units: meters
up_axis: z
objects:
  - id: hanging_rod
    semantic: fiber
    motion: dynamic
    geometry:
      type: curve_network
      radius: 0.028
      topology_asset: assets/hanging_rod_topology.json
    state_binding:
      selector: all
    material_id: elastic_rod
    collision_enabled: true
  - id: left_end_control
    semantic: rigid
    motion: kinematic
    geometry:
      type: cylinder
      radius: 0.085
      height: 0.32
    transform:
      translation: [-2.45, 0.0, 1.75]
      rotation_xyzw: [0.0, 0.70710678, 0.0, 0.70710678]
    material_id: fixed_control
    collision_enabled: false
  - id: right_end_control
    semantic: rigid
    motion: kinematic
    geometry:
      type: cylinder
      radius: 0.085
      height: 0.32
    transform:
      translation: [2.45, 0.0, 1.75]
      rotation_xyzw: [0.0, 0.70710678, 0.0, 0.70710678]
    material_id: driven_control
    collision_enabled: false
