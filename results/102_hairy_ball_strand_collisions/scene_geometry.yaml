schema_version: 1
units: meters
up_axis: z
objects:
  - id: rotating_ball
    semantic: rigid
    motion: kinematic
    geometry:
      type: sphere
      radius: 0.09
    transform:
      translation: [0.0, 0.0, 0.0]
    material_id: ball_ivory
    collision_enabled: true
  - id: elastic_hair
    semantic: fiber
    motion: dynamic
    geometry:
      type: curve_network
      topology_asset: assets/hair_topology.json
    state_binding:
      selector: all
    material_id: hair_copper
    collision_enabled: true
