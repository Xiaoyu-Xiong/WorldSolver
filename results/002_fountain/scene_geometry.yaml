schema_version: 1
units: meters
up_axis: z
objects:
  - id: circular_basin
    semantic: boundary
    motion: static
    geometry:
      type: axisymmetric_container
      inner_profile:
        - [1.50, 0.00]
        - [1.50, 0.44]
        - [1.50, 0.52]
      wall_thickness: 0.08
    material_id: basin_ceramic
    collision_enabled: true
  - id: fountain_nozzle
    semantic: emitter
    motion: static
    geometry:
      type: cylinder
      radius: 0.24
      height: 0.34
    transform:
      translation: [0.0, 0.0, 0.17]
    material_id: nozzle_metal
    collision_enabled: true
  - id: fountain_liquid
    semantic: liquid
    motion: dynamic
    geometry:
      type: particle_domain
      bounds_min: [-1.50, -1.50, 0.04]
      bounds_max: [1.50, 1.50, 3.20]
    state_binding:
      selector: all
    material_id: clear_water
    collision_enabled: true
