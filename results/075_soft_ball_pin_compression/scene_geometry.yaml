schema_version: 1
units: meters
up_axis: z
objects:
  - id: soft_ball
    semantic: deformable
    motion: dynamic
    geometry:
      type: triangle_mesh
      asset: assets/soft_ball_volume.json
      topology_asset: assets/soft_ball_volume.json
    transform:
      translation: [0.0, 0.0, 0.0]
    state_binding:
      selector: all
    material_id: soft_red_rubber
    collision_enabled: true
  - id: lower_pin_array
    semantic: fiber
    motion: static
    geometry:
      type: curve_network
      radius: 0.009
      topology_asset: assets/lower_pins.json
    transform:
      translation: [0.0, 0.0, 0.0]
    material_id: brushed_steel
    collision_enabled: true
  - id: upper_pin_array
    semantic: fiber
    motion: kinematic
    geometry:
      type: curve_network
      radius: 0.009
      topology_asset: assets/upper_pins.json
    transform:
      translation: [0.0, 0.0, 0.0]
    material_id: brushed_steel
    collision_enabled: true
