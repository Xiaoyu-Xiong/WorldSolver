schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [4.5, 2.0, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: felt
    collision_enabled: true
  - id: incoming_ball
    semantic: rigid
    motion: dynamic
    geometry: {type: sphere, radius: 0.2}
    transform: {translation: [-2.0, 0.0, 0.2]}
