    semantic: deformable
    motion: dynamic
    geometry:
      type: triangle_mesh
      asset: assets/pneumatic_finger.obj
    state_binding:
      selector: all
    material_id: silicone_coral
    collision_enabled: true
  - id: base_support
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [0.017, 0.026, 0.026]
    transform:
      translation: [0.014, 0.0, 0.026]
    material_id: support_dark
    collision_enabled: true
