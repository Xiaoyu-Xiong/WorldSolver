schema_version: 1
units: meters
up_axis: z
objects:
  - id: domain_floor
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [3.0, 1.2, 0.025]}
    transform: {translation: [0.0, 0.0, -0.025]}
    material_id: warm_floor
    collision_enabled: true
  - id: smoke_volume
    semantic: gas
    motion: field
    geometry: {type: voxel_grid, grid_shape: [100, 40, 100], bounds_min: [-3.0, -1.2, 0.0], bounds_max: [3.0, 1.2, 6.0]}
    state_binding: {selector: field, attribute_name: density}
    material_id: pale_smoke
    collision_enabled: false
  - id: source_disk
    semantic: emitter
    motion: static
    geometry: {type: cylinder, radius: 0.38, height: 0.04}
    transform: {translation: [-2.25, 0.0, 0.02]}
    material_id: source_dark
    collision_enabled: false
