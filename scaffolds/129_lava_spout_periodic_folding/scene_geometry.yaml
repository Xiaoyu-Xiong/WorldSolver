schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [3.2, 1.4, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: ground
    collision_enabled: true
  - id: catch_basin
    semantic: boundary
    motion: static
    geometry: {type: cylinder, radius: 1.35, height: 0.12}
    transform: {translation: [0.0, 0.0, 0.06]}
    material_id: basin
    collision_enabled: true
  - id: lava_nozzle
    semantic: emitter
    motion: static
    geometry: {type: cylinder, radius: 0.27, height: 0.42}
    transform: {translation: [0.0, 0.0, 3.02]}
    material_id: nozzle
    collision_enabled: false
  - id: subject
    semantic: liquid
    motion: dynamic
    geometry: {type: particle_domain, bounds_min: [-3.0, -1.2, 0.0], bounds_max: [3.0, 1.2, 3.8], grid_shape: [24, 16, 28]}
    state_binding: {selector: all}
    material_id: subject
    collision_enabled: true
