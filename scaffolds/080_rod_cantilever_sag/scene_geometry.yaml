schema_version: 1
units: meters
up_axis: z
objects:
  - id: clamp_body
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [0.09, 0.10, 0.13]
    transform:
      translation: [-0.09, 0.0, 1.15]
    material_id: clamp_metal
    collision_enabled: false
  - id: cantilever_rod
    semantic: fiber
    motion: dynamic
    geometry:
      type: curve_network
      radius: 0.012
      topology_asset: assets/rod_centerline.json
    state_binding:
      selector: all
    material_id: rod_elastomer
    collision_enabled: false
