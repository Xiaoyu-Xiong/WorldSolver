schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [3.2, 1.4, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: ground
    collision_enabled: true
  - id: subject
    semantic: deformable
    motion: dynamic
    geometry:
      type: triangle_mesh
      asset: assets/hollow_ball.obj
      topology_asset: assets/hollow_ball_topology.json
    state_binding: {selector: all}
    material_id: subject
    collision_enabled: true
