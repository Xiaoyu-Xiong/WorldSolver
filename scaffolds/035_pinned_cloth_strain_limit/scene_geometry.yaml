schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [1.75, 1.75, 0.04]
    transform:
      translation: [0.0, 0.0, -0.04]
    material_id: ground
    collision_enabled: true
  - id: fixed_sphere
    semantic: boundary
    motion: static
    geometry:
      type: sphere
      radius: 0.64
    transform:
      translation: [0.0, 0.0, 0.64]
    material_id: matte_sphere
    collision_enabled: true
  - id: draping_cloth
    semantic: cloth
    motion: dynamic
    geometry:
      type: triangle_mesh
      topology_asset: assets/cloth_topology.json
      grid_shape: [31, 31]
    state_binding:
      selector: all
    material_id: cyan_cloth
    collision_enabled: true

