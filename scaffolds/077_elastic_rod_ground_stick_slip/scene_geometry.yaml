schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground_plane
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [2.2, 0.7, 0.025]
    transform:
      translation: [0.75, 0.0, -0.025]
    material_id: ground
    collision_enabled: true
  - id: elastic_rod
    semantic: deformable
    motion: dynamic
    geometry:
      type: triangle_mesh
      asset: assets/rod_surface.obj
      topology_asset: assets/rod_surface.obj
    state_binding:
      selector: all
    material_id: rod
    collision_enabled: true
