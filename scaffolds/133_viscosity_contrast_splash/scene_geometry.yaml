schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [3.2, 1.4, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: ground
    collision_enabled: true
  - id: divider
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.08,0.9,0.65]}
    transform: {translation: [0,0,0.65]}
    material_id: obstacle
    collision_enabled: true
  - id: low_viscosity_pool
    semantic: liquid
    motion: dynamic
    geometry: {type: particle_domain, bounds_min: [-3.0, -1.2, 0.0], bounds_max: [3.0, 1.2, 3.8], grid_shape: [24, 16, 28]}
    state_binding: {selector: attribute, attribute_name: material_label, value: 0}
    material_id: low_viscosity
    collision_enabled: true
  - id: high_viscosity_pool
    semantic: liquid
    motion: dynamic
    geometry: {type: particle_domain, bounds_min: [-3.0, -1.2, 0.0], bounds_max: [3.0, 1.2, 3.8], grid_shape: [24, 16, 28]}
    state_binding: {selector: attribute, attribute_name: material_label, value: 1}
    material_id: high_viscosity
    collision_enabled: true
  - id: low_viscosity_drop
    semantic: liquid
    motion: dynamic
    geometry: {type: particle_domain, bounds_min: [-3.0, -1.2, 0.0], bounds_max: [3.0, 1.2, 3.8], grid_shape: [24, 16, 28]}
    state_binding: {selector: attribute, attribute_name: material_label, value: 2}
    material_id: low_viscosity
    collision_enabled: true
  - id: high_viscosity_drop
    semantic: liquid
    motion: dynamic
    geometry: {type: particle_domain, bounds_min: [-3.0, -1.2, 0.0], bounds_max: [3.0, 1.2, 3.8], grid_shape: [24, 16, 28]}
    state_binding: {selector: attribute, attribute_name: material_label, value: 3}
    material_id: high_viscosity
    collision_enabled: true
