schema_version: 1
units: meters
up_axis: z
objects:
  - id: hair_clump
    semantic: fiber
    motion: dynamic
    geometry:
      type: curve_network
      topology_asset: assets/hair_clump_topology.json
      radius: 0.0028
    state_binding: {selector: all}
    material_id: dark_hair
    collision_enabled: false
  - id: oscillating_root
    semantic: rigid
    motion: kinematic
    geometry: {type: sphere, radius: 0.012}
    transform: {translation: [0.0, 0.0, 0.30]}
    material_id: root_marker
    collision_enabled: false
  - id: root_grip
    semantic: rigid
    motion: kinematic
    geometry: {type: cylinder, radius: 0.009, height: 0.075}
    transform: {translation: [0.0, 0.0, 0.349]}
    material_id: brushed_metal
    collision_enabled: false
