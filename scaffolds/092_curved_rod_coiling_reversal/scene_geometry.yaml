schema_version: 1
units: meters
up_axis: z
objects:
  - id: elastic_rod
    semantic: fiber
    motion: dynamic
    geometry:
      type: curve_network
      topology_asset: assets/rod_topology.json
      radius: 0.0016
    state_binding:
      selector: all
    material_id: silicone_lime
    collision_enabled: true
  - id: substrate
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [0.24, 0.20, 0.008]
    transform:
      translation: [0.0, 0.0, -0.008]
    material_id: matte_black
    collision_enabled: true
  - id: injector
    semantic: emitter
    motion: static
    geometry:
      type: cylinder
      radius: 0.012
      height: 0.030
    transform:
      translation: [0.0, 0.0, 0.510]
    material_id: brushed_steel
    collision_enabled: false
