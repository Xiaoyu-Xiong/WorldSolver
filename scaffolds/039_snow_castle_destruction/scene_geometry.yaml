schema_version: 1
units: meters
up_axis: z
objects:
  - id: snow_floor
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [6.0, 4.0, 0.10]
    transform:
      translation: [0.5, 0.0, -0.10]
    material_id: packed_snow_floor
    collision_enabled: true
  - id: castle_snow
    semantic: granular
    motion: dynamic
    geometry:
      type: particle_domain
      bounds_min: [-1.55, -1.20, 0.0]
      bounds_max: [1.55, 1.20, 3.25]
    state_binding:
      selector: body_id
      value: 1
    material_id: warm_off_white_castle_snow
    collision_enabled: true
  - id: impact_ball
    semantic: rigid
    motion: dynamic
    geometry:
      type: sphere
      radius: 0.42
    transform:
      translation: [-2.85, 0.05, 0.82]
    state_binding:
      selector: body_id
      value: 2
    material_id: orange_striker
    collision_enabled: true
