schema_version: 1
units: meters
up_axis: z
objects:
  - id: receiving_floor
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [1.65, 1.35, 0.04]
    transform:
      translation: [0.0, 0.0, -0.04]
    material_id: floor_matte
    collision_enabled: true
  - id: supply_hopper
    semantic: boundary
    motion: static
    geometry:
      type: axisymmetric_container
      inner_profile:
        - [0.075, 1.42]
        - [0.075, 1.52]
        - [0.34, 1.72]
        - [0.34, 2.28]
      wall_thickness: 0.035
    material_id: hopper_white
    collision_enabled: true
  - id: sand
    semantic: granular
    motion: dynamic
    geometry:
      type: particle_domain
      bounds_min: [-1.55, -1.25, 0.0]
      bounds_max: [1.55, 1.25, 2.25]
    state_binding:
      selector: all
    material_id: dry_sand
    collision_enabled: true
