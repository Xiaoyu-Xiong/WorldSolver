schema_version: 1
units: meters
up_axis: z
objects:
  - id: ground
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [3.2, 1.4, 0.05]}
    transform: {translation: [0.0, 0.0, -0.05]}
    material_id: ground
    collision_enabled: true
  - id: obstacle_low
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.38,0.38,0.38]}
    transform: {translation: [-0.65,0,1.25]}
    material_id: obstacle
    collision_enabled: true
  - id: obstacle_high
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.42,0.42,0.42]}
    transform: {translation: [0.65,0,2.15]}
    material_id: obstacle
    collision_enabled: true
  - id: inlet_nozzle
    semantic: emitter
    motion: static
    geometry: {type: cylinder, radius: 0.40, height: 0.18}
    transform: {translation: [-2.72, 0.0, 1.0], rotation_xyzw: [0.0, 0.7071068, 0.0, 0.7071068]}
    material_id: emitter
    collision_enabled: false
  - id: subject
    semantic: gas
    motion: dynamic
    geometry: {type: voxel_grid, bounds_min: [-3.0, -1.2, 0.0], bounds_max: [3.0, 1.2, 3.8], grid_shape: [24, 16, 28]}
    state_binding: {selector: field, attribute_name: transported_scalar}
    material_id: subject
    collision_enabled: true
