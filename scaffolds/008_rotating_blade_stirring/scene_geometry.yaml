schema_version: 1
units: meters
up_axis: z
objects:
  - id: tank_floor
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.84, 0.84, 0.02]}
    transform: {translation: [0.0, 0.0, -0.02]}
    collision_enabled: true
  - id: tank_x_min
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.02, 0.84, 0.4]}
    transform: {translation: [-0.82, 0.0, 0.4]}
    collision_enabled: true
  - id: tank_x_max
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.02, 0.84, 0.4]}
    transform: {translation: [0.82, 0.0, 0.4]}
    collision_enabled: true
  - id: tank_y_min
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.8, 0.02, 0.4]}
    transform: {translation: [0.0, -0.82, 0.4]}
    collision_enabled: true
  - id: tank_y_max
    semantic: boundary
    motion: static
    geometry: {type: box, half_extents: [0.8, 0.02, 0.4]}
    transform: {translation: [0.0, 0.82, 0.4]}
    collision_enabled: true
  - id: stirring_blade
    semantic: rigid
    motion: kinematic
    geometry: {type: box, half_extents: [0.5, 0.03, 0.32]}
    transform: {translation: [0.0, 0.0, 0.36]}
    state_binding: {selector: body_id, value: 1}
    collision_enabled: true
  - id: stirred_liquid
    semantic: liquid
    motion: dynamic
    geometry:
      type: particle_domain
      bounds_min: [-0.8, -0.8, 0.0]
      bounds_max: [0.8, 0.8, 1.2]
    state_binding: {selector: body_id, value: 0}
    collision_enabled: true
