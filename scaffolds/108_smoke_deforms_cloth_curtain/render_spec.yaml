schema_version: 2
profile: multiphysics
environment: studio_dark
camera: frozen_config
bindings:
  - {object_id: floor, method: rigid_mesh, material: matte, color_rgb: [0.16, 0.15, 0.12]}
  - {object_id: support_bar, method: rigid_mesh, material: metal, color_rgb: [0.42, 0.45, 0.48]}
  - {object_id: left_clamp, method: rigid_mesh, material: metal, color_rgb: [0.55, 0.58, 0.62]}
  - {object_id: right_clamp, method: rigid_mesh, material: metal, color_rgb: [0.55, 0.58, 0.62]}
  - {object_id: curtain, method: shell_surface, material: cloth, color_rgb: [0.82, 0.035, 0.025], subdivision: 1}
  - object_id: smoke_volume
    method: volume
    material: smoke
    color_rgb: [0.86, 0.88, 0.92]
    opacity: 0.72
    volume_mode: slices
    volume_axis: 1
    density_scale: 5.5
  - {object_id: jet_nozzle, method: rigid_mesh, material: matte, color_rgb: [0.10, 0.11, 0.13]}
