    geometry:
      type: box
      half_extents: [3.10, 0.08, 0.05]
    transform:
      translation: [0.0, 0.0, 0.0]
    material_id: tank_wall
    collision_enabled: true
  - id: tank_left_wall
    semantic: boundary
