    transform:
      translation: [-3.05, 0.0, 1.50]
    material_id: tank_wall
    collision_enabled: true
  - id: tank_right_wall
    semantic: boundary
    motion: static
    geometry:
      type: box
      half_extents: [0.05, 0.08, 1.50]
    transform:
      translation: [3.05, 0.0, 1.50]
    material_id: tank_wall
    collision_enabled: true
  - id: liquid
    semantic: liquid
    motion: dynamic
    geometry:
      type: particle_domain
      bounds_min: [-2.75, -0.025, 0.10]
      bounds_max: [-1.25, 0.025, 2.50]
      grid_shape: [25, 1, 40]
